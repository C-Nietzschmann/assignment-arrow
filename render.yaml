# ============================================================================
# Render blueprint for Assignment Arrow
#
# The app is a static site: no server, no database, no API key, nothing to
# pay for. Every student's progress lives in their own browser, so nobody's
# scores can interfere with anybody else's.
#
# To deploy:  Render dashboard -> New -> Blueprint -> pick this repository.
# Or by hand: New -> Static Site -> Publish directory  .  -> Create.
# ============================================================================
services:
  - type: web
    runtime: static
    name: assignment-arrow
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    buildFilter:
      ignoredPaths:
        - tools/**
        - server/**
        - README.md
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      # Lessons and questions change often. Always revalidate so a student
      # never sits on a stale copy; unchanged files still come back as a
      # cheap 304 rather than a re-download.
      - path: /*.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
